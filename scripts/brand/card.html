<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Fredoka,sans-serif;background:#41B6E6}
  .shot{position:absolute;inset:0;background:url(shot.png) 70% 40%/auto 118% no-repeat}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(65,182,230,1) 0,rgba(65,182,230,.95) 34%,rgba(65,182,230,0) 52%)}
  .copy{position:absolute;left:64px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .awning{position:relative;display:inline-block;align-self:flex-start;padding:10px 40px 26px;background:#E4002B;color:#fff;font-weight:700;font-size:104px;line-height:1;border-radius:36px 36px 10px 10px;box-shadow:0 10px 0 #9E001E;letter-spacing:-2px}
  .awning:after{content:'';position:absolute;left:10px;right:10px;bottom:-18px;height:26px;background:radial-gradient(circle at 18px 0,#E4002B 17px,transparent 18px) 0 0/36px 26px repeat-x}
  .tag{font-size:60px;font-weight:700;color:#fff;-webkit-text-stroke:3px #1D2A5C;paint-order:stroke fill;text-shadow:0 6px 0 #1D2A5C;margin-top:16px}
  .chips{display:flex;gap:12px}
  .chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 20px 8px 10px;font-size:28px;font-weight:700;color:#1D2A5C;box-shadow:0 6px 0 #2585AE}
  .chip i{width:34px;height:34px;border-radius:50%;display:block}
</style></head><body>
<div class="shot"></div><div class="fade"></div>
<div class="copy">
  <div class="awning">Pip Pop</div>
  <div class="tag">Dig. Pop. Bonk!</div>
  <div class="chips"><span class="chip"><i style="background:#FFC72C"></i>toys</span><span class="chip"><i style="background:#43B02A"></i>mats</span><span class="chip"><i style="background:#E4002B"></i>pals</span></div>
</div>
</body></html>
