      <p class="nojs-logo">Pip Pop</p>
      <h2>Dig. Pop. Bonk!</h2>
      <p>Pip Pop is a free 3D toy-box game that plays in your browser. Open a gift to meet your crowned teddy bear, then grow a play mat full of chunky toys: a digger digs rocks, a popper pops them into stars, and stars fill your club's fridge with juice to make even more toys.</p>
      <p>Roll your wagon to other kids' mats, bonk their bear and grab the rocks they left lying out. Every kid you meet is a real player on the Structs network.</p>
      <h2>Rooms</h2>
      <ul>
        <li><b>Mat</b>: your play mat and its toys, on a stacking pole of Moon, Sky, Grass and Tub.</li>
        <li><b>Toys</b>: a shelf of 22 toys to make, from the Digger and Popper to the Rocket, Duck and Sun.</li>
        <li><b>Sky</b>: every kid's mat hanging from a giant crib mobile.</li>
        <li><b>Bonk</b>: roll, bonk and grab.</li>
        <li><b>Fridge</b>: turn stars into juice.</li>
        <li><b>Book</b>: a picture dictionary of every symbol.</li>
      </ul>
      <p>Pip Pop needs JavaScript and WebGL. Learn more about <a href="https://playstructs.com">Structs</a>, or read the <a href="https://structs.ai">Structs technical documentation</a>.</p>
    </main>
  </noscript>
